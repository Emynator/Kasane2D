name: Publish NuGet packages
on:
  push:
    branches:
      - release
    paths:
      - "src/**"
      - ".github/workflows/nuget.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore src/Kasane2D.slnx
      - name: Pack
        run: >
          dotnet pack
          src/Kasane2D.slnx
          --configuration Release
          --no-restore
          --output artifacts/packages
      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: Emynator
      - name: Publish packages
        run: >
          dotnet nuget push
          "artifacts/packages/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
